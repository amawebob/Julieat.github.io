<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Julie Abdel — Le Saint Coran</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E4E73'/%3E%3Cpath d='M32 16 C24 12 14 12 10 16 V46 C14 42 24 42 32 46 C40 42 50 42 54 46 V16 C50 12 40 12 32 16 Z' fill='%23FFFFFF'/%3E%3Cpath d='M32 16 V46' stroke='%231C7FB8' stroke-width='1.6'/%3E%3Cpath d='M14 21 H27 M14 27 H27 M14 33 H25 M37 21 H50 M37 27 H50 M39 33 H50' stroke='%231C7FB8' stroke-width='1.6' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='11' r='3.2' fill='%23B98A3B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFF7FC;
    --bg-deep:#DCEEFA;
    --sky-top:#BFE3F5;
    --card:#FFFFFF;
    --card-hover:#F3FAFE;
    --border:rgba(15,80,120,.16);
    --border-soft:rgba(15,80,120,.09);
    --navy:#0B3654;
    --navy-soft:#3A5D74;
    --azure:#1C7FB8;
    --azure-bright:#2FA3DE;
    --azure-deep:#0E4E73;
    --brass:#B98A3B;
    --muted:#5C7A8C;
    --radius:16px;
    --display:'Playfair Display',serif;
    --arabic:'Amiri','Traditional Arabic',serif;
    --serif-en:'Source Serif 4',serif;
    --ui:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--navy);
    font-family:var(--serif-en);
    min-height:100vh;
  }
  ::selection{background:var(--azure-bright);color:#fff;}
  a{color:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--azure);}

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    padding:70px 24px 0;
    text-align:center;
    overflow:hidden;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--bg) 88%);
  }
  .hero-content{position:relative; z-index:1; padding-bottom:36px;}
  .hero-eyebrow{
    font-family:var(--ui); letter-spacing:.28em;
    font-size:11.5px; color:var(--azure-deep); margin-bottom:16px; font-weight:600;
  }
  .hero-title-ar{
    font-family:var(--arabic); font-size:clamp(32px,5.5vw,54px);
    color:var(--navy); direction:rtl; line-height:1.3; margin:0 0 8px;
  }
  .hero-title-en{
    font-family:var(--display); font-weight:600; font-style:italic;
    font-size:clamp(20px,2.8vw,28px); color:var(--azure-deep); margin:0 0 16px;
  }
  .hero-sub{
    font-family:var(--serif-en); font-size:15px; color:var(--navy-soft);
    max-width:520px; margin:0 auto 30px; line-height:1.65;
  }
  .search-wrap{max-width:420px; margin:0 auto; position:relative;}
  .search-wrap input{
    width:100%; padding:13px 18px 13px 42px; border-radius:999px;
    border:1px solid var(--border); background:#fff;
    color:var(--navy); font-family:var(--ui); font-size:14px; outline:none;
    transition:border-color .2s, box-shadow .2s;
    box-shadow:0 2px 10px rgba(15,80,120,.06);
  }
  .search-wrap input:focus{border-color:var(--azure); box-shadow:0 0 0 3px rgba(28,127,184,.14);}
  .search-wrap input::placeholder{color:var(--muted);}
  .search-icon{position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--azure); font-size:14px;}

  /* wave divider like the gulf shoreline */
  .wave{display:block; width:100%; height:34px; margin-top:8px;}

  /* ---------- Layout ---------- */
  .app{display:grid; grid-template-columns:300px 1fr; min-height:60vh; max-width:1280px; margin:0 auto;}
  .sidebar{
    border-right:1px solid var(--border-soft);
    padding:20px 12px 100px; max-height:100vh; overflow-y:auto;
    position:sticky; top:0; align-self:start;
  }
  .sidebar-label{
    font-family:var(--ui); font-size:11px; letter-spacing:.14em;
    color:var(--muted); padding:0 10px 12px; font-weight:600;
  }
  .surah-item{
    display:flex; align-items:center; gap:12px; padding:10px 12px;
    border-radius:12px; cursor:pointer; transition:background .15s; border:1px solid transparent;
  }
  .surah-item:hover{background:var(--card-hover);}
  .surah-item.active{background:#E4F3FC; border-color:var(--border);}
  .surah-num{
    width:30px; height:30px; flex:none; border-radius:50%;
    border:1.5px solid var(--azure); display:flex; align-items:center; justify-content:center;
    font-family:var(--ui); font-size:11px; color:var(--azure-deep);
  }
  .surah-item.active .surah-num{background:var(--azure); color:#fff; border-color:var(--azure);}
  .surah-meta{flex:1; min-width:0;}
  .surah-en{font-family:var(--ui); font-size:13.5px; color:var(--navy); font-weight:500;}
  .surah-sub{font-family:var(--ui); font-size:11px; color:var(--muted); margin-top:1px;}
  .surah-ar{font-family:var(--arabic); font-size:16px; color:var(--azure); flex:none;}

  .main{padding:36px 28px 140px; min-width:0;}

  /* Moroccan riad arch framing the surah header */
  .arch-wrap{position:relative; margin-bottom:34px;}
  .arch-shape{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:120px 120px 16px 16px;
    padding:44px 26px 26px;
    text-align:center;
    box-shadow:0 10px 40px -18px rgba(14,78,115,.28);
    position:relative;
  }
  .arch-scallop{position:absolute; top:-1px; left:0; right:0; height:26px;}
  .surah-header-ar{font-family:var(--arabic); font-size:32px; color:var(--navy);}
  .surah-header-en{font-family:var(--ui); font-size:13px; letter-spacing:.05em; color:var(--muted); margin-top:8px;}
  .surah-header-meta{font-family:var(--ui); font-size:11.5px; color:var(--azure-deep); margin-top:10px;}
  .bismillah{font-family:var(--arabic); font-size:23px; color:var(--navy-soft); margin-top:18px; direction:rtl;}

  .ayah-card{
    border:1px solid var(--border-soft); border-radius:var(--radius);
    padding:22px; margin-bottom:16px; background:var(--card);
    position:relative; transition:border-color .3s, box-shadow .3s;
  }
  .ayah-card.active{
    border-color:var(--azure); box-shadow:0 0 0 1px rgba(28,127,184,.2), 0 14px 40px -16px rgba(28,127,184,.35);
  }
  .ayah-card.active .ayah-badge{background:var(--azure); color:#fff; border-color:var(--azure);}
  .ayah-top{display:flex; align-items:flex-start; justify-content:space-between; gap:14px;}
  .ayah-badge{
    width:32px; height:32px; flex:none; border-radius:50%; border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-family:var(--ui);
    font-size:12px; color:var(--azure-deep); transition:background .2s,color .2s;
  }
  .icon-btn{
    width:32px; height:32px; border-radius:50%; border:1.5px solid var(--azure);
    background:transparent; color:var(--azure-deep); cursor:pointer; display:flex; align-items:center;
    justify-content:center; transition:background .15s, color .15s; font-size:13px;
  }
  .icon-btn:hover{background:var(--azure); color:#fff;}
  .icon-btn.playing{background:var(--azure); color:#fff; animation:ripple 1.7s ease-out infinite;}
  @keyframes ripple{0%{box-shadow:0 0 0 0 rgba(28,127,184,.45);}100%{box-shadow:0 0 0 9px rgba(28,127,184,0);}}
  .ayah-arabic{
    font-family:var(--arabic); font-size:clamp(24px,3vw,29px); line-height:2.15; color:var(--navy);
    direction:rtl; text-align:right; margin:16px 0 14px;
  }
  .ayah-translation{font-family:var(--serif-en); font-size:16.5px; line-height:1.7; color:var(--navy-soft);}
  .tafsir-toggle{
    margin-top:14px; background:none; border:none; color:var(--azure-deep); font-family:var(--ui);
    font-size:12px; cursor:pointer; padding:0; display:flex; align-items:center; gap:6px; font-weight:500;
  }
  .tafsir-toggle:hover{color:var(--azure);}
  .tafsir-box{
    margin-top:14px; padding:16px; border-radius:12px; border:1px solid var(--border-soft);
    background:#F7FBFE; font-family:var(--ui); font-size:13.5px; line-height:1.75; color:var(--navy-soft);
    display:none;
  }
  .tafsir-box.open{display:block;}
  .tafsir-box .label{color:var(--azure-deep); font-size:11px; letter-spacing:.06em; margin-bottom:8px; display:block; font-weight:600;}

  .state-msg{text-align:center; padding:60px 20px; color:var(--muted); font-family:var(--ui); font-size:14px;}
  .spinner{
    width:26px; height:26px; border-radius:50%; border:2px solid var(--border);
    border-top-color:var(--azure); margin:0 auto 14px; animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Player bar ---------- */
  .player-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:rgba(255,255,255,.94); backdrop-filter:blur(10px);
    border-top:1px solid var(--border); padding:12px 20px;
    display:flex; align-items:center; gap:16px;
    transform:translateY(100%); transition:transform .35s ease;
    box-shadow:0 -6px 24px rgba(14,78,115,.08);
  }
  .player-bar.visible{transform:translateY(0);}
  .player-info{flex:1; min-width:0; font-family:var(--ui);}
  .player-info .pname{font-size:13px; color:var(--navy); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .player-info .pref{font-size:11px; color:var(--muted);}
  .player-progress{flex:2; height:4px; background:var(--border-soft); border-radius:2px; position:relative; cursor:pointer; max-width:400px;}
  .player-progress-fill{height:100%; background:var(--azure); border-radius:2px; width:0%;}
  .player-controls{display:flex; align-items:center; gap:10px; flex:none;}
  .player-controls .icon-btn{width:36px; height:36px;}
  .play-main{width:42px; height:42px; font-size:15px; background:var(--azure); color:#fff;}
  .auto-toggle{
    font-family:var(--ui); font-size:10.5px; color:var(--muted); border:1.5px solid var(--border);
    background:transparent; border-radius:999px; padding:6px 12px; cursor:pointer; transition:all .15s; white-space:nowrap;
  }
  .auto-toggle.on{color:#fff; background:var(--azure); border-color:var(--azure);}

  .menu-toggle{display:none;}

  /* ---------- Footer ---------- */
  .site-footer{
    text-align:center; padding:34px 20px 26px; margin-top:20px;
    border-top:1px solid var(--border-soft);
    background:linear-gradient(180deg, transparent, var(--bg-deep) 140%);
  }
  .site-footer .footer-dua{
    font-family:var(--display); font-style:italic; font-weight:600;
    font-size:16px; color:var(--azure-deep); margin-bottom:6px;
  }
  .site-footer .footer-brand{
    font-family:var(--ui); font-size:12px; letter-spacing:.08em; color:var(--muted);
  }
  @media (max-width:860px){
    .app{grid-template-columns:1fr;}
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; width:82%; max-width:320px; z-index:60;
      background:#fff; transform:translateX(-100%); transition:transform .3s ease;
      box-shadow:20px 0 60px rgba(14,78,115,.2);
    }
    .sidebar.open{transform:translateX(0);}
    .sidebar-overlay{display:none; position:fixed; inset:0; background:rgba(11,54,84,.35); z-index:55;}
    .sidebar-overlay.open{display:block;}
    .menu-toggle{
      display:flex; position:fixed; top:16px; left:16px; z-index:70;
      width:38px; height:38px; align-items:center; justify-content:center;
      background:#fff; border:1px solid var(--border); border-radius:10px; color:var(--azure-deep); cursor:pointer;
      box-shadow:0 2px 10px rgba(14,78,115,.12);
    }
    .main{padding:64px 16px 140px;}
    .player-bar{padding:10px 12px;}
    .player-progress{display:none;}
  }
</style>
</head>
<body>

<button class="menu-toggle" id="menuToggle" aria-label="Ouvrir la liste des sourates">☰</button>
<div class="sidebar-overlay" id="overlay"></div>

<div class="hero">
  <div class="hero-content">
    <div class="hero-eyebrow">Julie Abdel</div>
    <div class="hero-title-ar">القرآن الكريم</div>
    <div class="hero-title-en">Le Saint Coran</div>
    <p class="hero-sub">Lisez le texte arabe, suivez la traduction française, écoutez la récitation et explorez le tafsir — réunis dans un espace calme et épuré.</p>
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="surahSearch" placeholder="Rechercher une sourate par nom ou numéro…">
    </div>
  </div>
  <svg class="wave" viewBox="0 0 1200 60" preserveAspectRatio="none">
    <path d="M0,30 C150,55 300,5 450,30 C600,55 750,5 900,30 C1050,55 1150,15 1200,25 L1200,60 L0,60 Z" fill="#DCEEFA"/>
    <path d="M0,38 C150,58 300,20 450,38 C600,58 750,20 900,38 C1050,58 1150,30 1200,35" fill="none" stroke="#1C7FB8" stroke-width="1.2" opacity="0.35"/>
  </svg>
</div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-label">114 sourates</div>
    <div id="surahList">
      <div class="state-msg"><div class="spinner"></div>Chargement de l'index des sourates…</div>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="state-msg"><div class="spinner"></div>Ouverture du Mus'haf…</div>
  </main>
</div>

<div class="player-bar" id="playerBar">
  <div class="player-info">
    <div class="pname" id="pName">—</div>
    <div class="pref" id="pRef">—</div>
  </div>
  <div class="player-progress" id="progressBar"><div class="player-progress-fill" id="progressFill"></div></div>
  <div class="player-controls">
    <button class="icon-btn" id="prevBtn" title="Verset précédent">⟨</button>
    <button class="icon-btn play-main" id="playPauseBtn" title="Lecture/Pause">▶</button>
    <button class="icon-btn" id="nextBtn" title="Verset suivant">⟩</button>
    <button class="auto-toggle" id="autoToggle">Lecture continue</button>
  </div>
</div>

<footer class="site-footer">
  <div class="footer-dua">Priez pour nous </div>
  <div class="footer-brand">Julie Abdel © 2026</div>
</footer>

<audio id="audioEl" preload="none"></audio>

<script>
(function(){
  const ARCH_SCALLOP = `<svg class="arch-scallop" viewBox="0 0 300 26" preserveAspectRatio="none">
    <path d="M0,26 Q15,0 30,26 Q45,0 60,26 Q75,0 90,26 Q105,0 120,26 Q135,0 150,26 Q165,0 180,26 Q195,0 210,26 Q225,0 240,26 Q255,0 270,26 Q285,0 300,26"
      fill="none" stroke="#1C7FB8" stroke-width="1.4" opacity="0.5"/>
  </svg>`;

  const surahListEl = document.getElementById('surahList');
  const mainEl = document.getElementById('main');
  const searchInput = document.getElementById('surahSearch');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const menuToggle = document.getElementById('menuToggle');
  const playerBar = document.getElementById('playerBar');
  const audioEl = document.getElementById('audioEl');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const autoToggle = document.getElementById('autoToggle');
  const pName = document.getElementById('pName');
  const pRef = document.getElementById('pRef');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');

  let surahs = [];
  let currentSurahNum = null;
  let verses = [];
  let currentAyahIdx = -1;
  let autoContinue = false;

  fetch('https://api.alquran.cloud/v1/surah')
    .then(r => r.json())
    .then(data => {
      surahs = data.data;
      renderSurahList(surahs);
      selectSurah(1);
    })
    .catch(() => {
      surahListEl.innerHTML = '<div class="state-msg">Impossible de charger l\'index des sourates.<br>Vérifiez votre connexion et rechargez la page.</div>';
    });

  function renderSurahList(list){
    surahListEl.innerHTML = list.map(s => `
      <div class="surah-item${s.number === currentSurahNum ? ' active' : ''}" data-num="${s.number}">
        <div class="surah-num">${s.number}</div>
        <div class="surah-meta">
          <div class="surah-en">${s.englishName}</div>
          <div class="surah-sub">${s.englishNameTranslation} · ${s.numberOfAyahs} versets</div>
        </div>
        <div class="surah-ar">${s.name}</div>
      </div>
    `).join('');
    surahListEl.querySelectorAll('.surah-item').forEach(el => {
      el.addEventListener('click', () => {
        selectSurah(parseInt(el.dataset.num, 10));
        closeSidebar();
      });
    });
  }

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    if(!q){ renderSurahList(surahs); return; }
    const filtered = surahs.filter(s =>
      s.englishName.toLowerCase().includes(q) ||
      s.englishNameTranslation.toLowerCase().includes(q) ||
      String(s.number) === q ||
      s.name.includes(q)
    );
    renderSurahList(filtered);
  });

  menuToggle.addEventListener('click', () => { sidebar.classList.add('open'); overlay.classList.add('open'); });
  overlay.addEventListener('click', closeSidebar);
  function closeSidebar(){ sidebar.classList.remove('open'); overlay.classList.remove('open'); }

  function selectSurah(num){
    currentSurahNum = num;
    verses = [];
    currentAyahIdx = -1;
    document.querySelectorAll('.surah-item').forEach(el => {
      el.classList.toggle('active', parseInt(el.dataset.num,10) === num);
    });
    mainEl.innerHTML = '<div class="state-msg"><div class="spinner"></div>Chargement de la sourate…</div>';

    fetch(`https://api.alquran.cloud/v1/surah/${num}/editions/quran-uthmani,fr.hamidullah,ar.alafasy`)
      .then(r => r.json())
      .then(data => {
        const [arabicEd, transEd, audioEd] = data.data;
        verses = arabicEd.ayahs.map((a, i) => ({
          numberInSurah: a.numberInSurah,
          globalNumber: a.number,
          arabic: a.text,
          translation: transEd.ayahs[i] ? transEd.ayahs[i].text : '',
          audio: audioEd.ayahs[i] ? audioEd.ayahs[i].audio : null,
          tafsirHtml: null
        }));
        renderSurah();
      })
      .catch(() => {
        mainEl.innerHTML = '<div class="state-msg">Impossible de charger cette sourate.<br>Veuillez réessayer.</div>';
      });
  }

  function renderSurah(){
    const meta = surahs.find(s => s.number === currentSurahNum) || {};
    const showBismillah = currentSurahNum !== 1 && currentSurahNum !== 9;
    mainEl.innerHTML = `
      <div class="arch-wrap">
        <div class="arch-shape">
          ${ARCH_SCALLOP}
          <div class="surah-header-ar">${meta.name || ''}</div>
          <div class="surah-header-en">${meta.englishName || ''} — "${meta.englishNameTranslation || ''}"</div>
          <div class="surah-header-meta">${meta.revelationType === 'Meccan' ? 'MECQUOISE' : 'MÉDINOISE'} · ${meta.numberOfAyahs || verses.length} VERSETS</div>
          ${showBismillah ? '<div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>' : ''}
        </div>
      </div>
      <div id="ayahList"></div>
    `;
    const ayahList = document.getElementById('ayahList');
    ayahList.innerHTML = verses.map((v, i) => `
      <div class="ayah-card" id="ayah-${i}" data-idx="${i}">
        <div class="ayah-top">
          <div class="ayah-badge">${v.numberInSurah}</div>
          <button class="icon-btn play-ayah" data-idx="${i}" title="Écouter la récitation">▶</button>
        </div>
        <div class="ayah-arabic">${v.arabic}</div>
        <div class="ayah-translation">${v.translation}</div>
        <button class="tafsir-toggle" data-idx="${i}">☰ Tafsir</button>
        <div class="tafsir-box" id="tafsir-${i}"></div>
      </div>
    `).join('');

    ayahList.querySelectorAll('.play-ayah').forEach(btn => {
      btn.addEventListener('click', () => playAyah(parseInt(btn.dataset.idx,10)));
    });
    ayahList.querySelectorAll('.tafsir-toggle').forEach(btn => {
      btn.addEventListener('click', () => toggleTafsir(parseInt(btn.dataset.idx,10)));
    });
  }

  function toggleTafsir(idx){
    const box = document.getElementById(`tafsir-${idx}`);
    const isOpen = box.classList.toggle('open');
    if(!isOpen) return;
    const v = verses[idx];
    if(v.tafsirHtml){
      box.innerHTML = `<span class="label">Tafsir Ibn Kathir</span>${v.tafsirHtml}`;
      return;
    }
    box.innerHTML = '<div class="spinner"></div>';
    const verseKey = `${currentSurahNum}:${v.numberInSurah}`;
    fetch(`https://api.islamic.app/v1/verses/by_key/${verseKey}?tafsirs=en-tafisr-ibn-kathir`)
      .then(r => r.json())
      .then(data => {
        const t = data && data.data && data.data.verse && data.data.verse.tafsirs && data.data.verse.tafsirs[0];
        const text = t && t.text ? t.text : 'Aucun tafsir disponible pour ce verset.';
        v.tafsirHtml = text;
        box.innerHTML = `<span class="label">Tafsir Ibn Kathir (texte en anglais)</span>${text}`;
      })
      .catch(() => {
        box.innerHTML = `<span class="label">Tafsir</span>Le tafsir n'a pas pu être chargé pour le moment. Merci de réessayer un peu plus tard.`;
      });
  }

  function playAyah(idx){
    if(idx < 0 || idx >= verses.length) return;
    const v = verses[idx];
    if(!v.audio) return;
    if(currentAyahIdx === idx && !audioEl.paused){ audioEl.pause(); return; }
    currentAyahIdx = idx;
    audioEl.src = v.audio;
    audioEl.play().catch(()=>{});
    updateActiveCard();
    updatePlayerBar();
    playerBar.classList.add('visible');
    document.getElementById(`ayah-${idx}`).scrollIntoView({behavior:'smooth', block:'center'});
  }

  audioEl.addEventListener('play', () => setPlayIcons(true));
  audioEl.addEventListener('pause', () => setPlayIcons(false));
  audioEl.addEventListener('ended', () => {
    setPlayIcons(false);
    if(autoContinue && currentAyahIdx < verses.length - 1){ playAyah(currentAyahIdx + 1); }
  });
  audioEl.addEventListener('timeupdate', () => {
    if(audioEl.duration){ progressFill.style.width = ((audioEl.currentTime / audioEl.duration) * 100) + '%'; }
  });

  function setPlayIcons(playing){
    playPauseBtn.textContent = playing ? '❚❚' : '▶';
    document.querySelectorAll('.play-ayah').forEach(btn => {
      const idx = parseInt(btn.dataset.idx,10);
      btn.textContent = (playing && idx === currentAyahIdx) ? '❚❚' : '▶';
      btn.classList.toggle('playing', playing && idx === currentAyahIdx);
    });
  }

  function updateActiveCard(){
    document.querySelectorAll('.ayah-card').forEach(c => c.classList.remove('active'));
    const active = document.getElementById(`ayah-${currentAyahIdx}`);
    if(active) active.classList.add('active');
  }

  function updatePlayerBar(){
    const v = verses[currentAyahIdx];
    const meta = surahs.find(s => s.number === currentSurahNum) || {};
    pName.textContent = `${meta.englishName || ''} — Verset ${v.numberInSurah}`;
    pRef.textContent = `${currentSurahNum}:${v.numberInSurah} · Mishary Alafasy`;
  }

  playPauseBtn.addEventListener('click', () => {
    if(currentAyahIdx === -1) return;
    if(audioEl.paused) audioEl.play().catch(()=>{});
    else audioEl.pause();
  });
  prevBtn.addEventListener('click', () => { if(currentAyahIdx > 0) playAyah(currentAyahIdx - 1); });
  nextBtn.addEventListener('click', () => { if(currentAyahIdx < verses.length - 1) playAyah(currentAyahIdx + 1); });
  autoToggle.addEventListener('click', () => {
    autoContinue = !autoContinue;
    autoToggle.classList.toggle('on', autoContinue);
  });
  progressBar.addEventListener('click', (e) => {
    if(!audioEl.duration) return;
    const rect = progressBar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audioEl.currentTime = pct * audioEl.duration;
  });
})();
</script>
</body>
</html>
